# Backend runs with network_mode: host and listens on BACKEND_PORT (default 55511).
# From the admin bridge network, reach the host via the default Docker bridge gateway
# (172.17.0.1) — reliable on Ubuntu Docker without Docker Desktop DNS.
# Fallback if bip differs: host.docker.internal (extra_hosts: host-gateway) or the host LAN IP.
upstream proaqua_backend {
    server 172.17.0.1:55511;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64M;

    # Fail fast when host backend is down / unreachable (avoids long hangs).
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Use $http_host (includes :55512) — not $host — so ASP.NET AbsoluteImageUrl
    # builds http://host:55512/... instead of http://host/... (port 80 → 404).
    location /api/ {
        proxy_pass http://proaqua_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_intercept_errors off;
    }

    # Swagger UI + OpenAPI JSON (backend UseSwagger/UseSwaggerUI at /swagger)
    location ^~ /swagger {
        proxy_pass http://proaqua_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ^~ /uploads/ {
        proxy_pass http://proaqua_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
