upstream proaqua_backend {
    server backend:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64M;

    location /api/ {
        proxy_pass http://proaqua_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI + OpenAPI JSON (backend UseSwagger/UseSwaggerUI at /swagger)
    location ^~ /swagger {
        proxy_pass http://proaqua_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://proaqua_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
