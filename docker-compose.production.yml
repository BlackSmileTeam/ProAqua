services:
  # Optional local MySQL — not used when API points at external/host MySQL via DB_CONNECTION_STRING.
  # Start only if needed: docker compose --profile local-mysql -f docker-compose.production.yml up -d
  mysql:
    profiles:
      - local-mysql
    image: mysql:8.0
    container_name: proaqua-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_APP_USER}", "-p${MYSQL_APP_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/ProAqua.Api
      dockerfile: Dockerfile
    container_name: proaqua-backend
    restart: unless-stopped
    # Host network: shares the host stack. Deploy remaps APP Server=PROD_HOST → 127.0.0.1
    # (NAT hairpin: connecting to the host's own public IP from itself times out).
    # ports: is incompatible with network_mode: host — bind via ASPNETCORE_URLS instead.
    network_mode: host
    # No depends_on mysql: production API uses APP_CONNECTION_STRING (typically Server=127.0.0.1),
    # not the optional compose mysql service.
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:${BACKEND_PORT:-55511}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      Swagger__Enabled: ${ENABLE_SWAGGER:-true}
      ConnectionStrings__DefaultConnection: ${APP_CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Push__Provider: ${PUSH_PROVIDER:-Dev}
      AmoCrm__Enabled: ${AMOCRM_ENABLED:-false}
      AmoCrm__BaseUrl: ${AMOCRM_BASE_URL:-}
      AmoCrm__AccessToken: ${AMOCRM_ACCESS_TOKEN:-}
      AmoCrm__PipelineId: ${AMOCRM_PIPELINE_ID:-}
      AmoCrm__StatusId: ${AMOCRM_STATUS_ID:-}
    volumes:
      - ./data/wwwroot:/app/wwwroot
    healthcheck:
      # Host mode: probe loopback on the published API port (no curl in aspnet image).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/${BACKEND_PORT:-55511}'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        NGINX_CONFIG: nginx.compose.conf
    container_name: proaqua-admin
    restart: unless-stopped
    depends_on:
      - backend
    # Backend uses host network (not on compose DNS). Nginx proxies to host.docker.internal:55511
    # (see admin/nginx.compose.conf). If you change BACKEND_PORT, update that conf and rebuild admin.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  mysql_data:
