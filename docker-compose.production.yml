services:
  # Optional local MySQL — not used when API points at external/host MySQL via DB_CONNECTION_STRING.
  # Start only if needed: docker compose --profile local-mysql -f docker-compose.production.yml up -d
  mysql:
    profiles:
      - local-mysql
    image: mysql:8.0
    container_name: proaqua-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_APP_USER}", "-p${MYSQL_APP_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/ProAqua.Api
      dockerfile: Dockerfile
    container_name: proaqua-backend
    restart: unless-stopped
    # No depends_on mysql: production API uses APP_CONNECTION_STRING from DB_CONNECTION_STRING
    # (e.g. Server=139.100.225.234), not the optional compose mysql service.
    # Hairpin fix: secret keeps Server=139.100.225.234; map that IP to the Docker host
    # so the container reaches host MySQL (bind must allow docker bridge / 0.0.0.0).
    # Port= in DB_CONNECTION_STRING must match the host listener (often 3306, not 3307).
    extra_hosts:
      - "139.100.225.234:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      Swagger__Enabled: ${ENABLE_SWAGGER:-true}
      ConnectionStrings__DefaultConnection: ${APP_CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Push__Provider: ${PUSH_PROVIDER:-Dev}
      AmoCrm__Enabled: ${AMOCRM_ENABLED:-false}
      AmoCrm__BaseUrl: ${AMOCRM_BASE_URL:-}
      AmoCrm__AccessToken: ${AMOCRM_ACCESS_TOKEN:-}
      AmoCrm__PipelineId: ${AMOCRM_PIPELINE_ID:-}
      AmoCrm__StatusId: ${AMOCRM_STATUS_ID:-}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./data/wwwroot:/app/wwwroot

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        NGINX_CONFIG: nginx.compose.conf
    container_name: proaqua-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  mysql_data:
