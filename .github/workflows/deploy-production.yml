name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proaqua-production-deploy
  cancel-in-progress: true

jobs:
  deploy-prod:
    name: Deploy → PROD_HOST
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (PROD)
        id: ssh
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          envs: DB_CONNECTION_STRING,JWT_KEY,GITHUB_TOKEN,GITHUB_REPOSITORY
          script: |
            set -euo pipefail
            trap 'echo "ERROR: deploy failed at line $LINENO (exit $?)" >&2' ERR

            TARGET="PROD"
            echo "==> Deploy target: $TARGET (${{ secrets.PROD_HOST }})"
            echo "==> whoami=$(whoami) HOME=$HOME pwd=$(pwd)"

            # --- Required secrets via appleboy envs (avoids shell-quoting breakage) ---
            echo "==> Resolving DB connection string secret"
            CONN="${DB_CONNECTION_STRING:-}"
            if [ -z "$CONN" ]; then
              echo "ERROR: set repository secret DB_CONNECTION_STRING (MySQL connection string)"
              exit 1
            fi
            echo "==> Connection string secret present (length=${#CONN})"

            JWT_KEY_VAL="${JWT_KEY:-}"
            if [ -z "$JWT_KEY_VAL" ]; then
              echo "ERROR: set repository secret JWT_KEY"
              exit 1
            fi

            if ! command -v python3 >/dev/null 2>&1; then
              echo "ERROR: python3 is required on the deploy host to parse DB_CONNECTION_STRING"
              exit 1
            fi

            # Parse User/Password/Database for optional compose mysql MYSQL_* vars.
            # APP_CONNECTION_STRING: if Server equals PROD_HOST (or 139.100.225.234), remap to
            # 127.0.0.1 to avoid same-host NAT hairpin. Do NOT rewrite Server=mysql.
            # IMPORTANT: no bash/Python heredocs - appleboy/drone-ssh injects
            # DRONE_SSH_PREV_COMMAND_EXIT_CODE=... between script lines and breaks heredocs.
            # Base64 payload is one logical pipeline so Python never sees those bash snippets.
            echo "==> Parsing DB_CONNECTION_STRING"
            eval "$(echo '' | base64 -d | CONN="$CONN" PROD_HOST="${{ secrets.PROD_HOST }}" python3 -)"

            # Root password: stable documented default (not a GitHub secret).
            # First-time MySQL volume init uses this; changing it later does NOT update an existing volume.
            # Default matches .env.production.example — do not randomize on each deploy.
            # MYSQL_* below only matter if you start the optional compose mysql profile (local-mysql).
            MYSQL_ROOT_PASSWORD="RootMysql_ChangeMe_2026!"

            if [ "${APP_SERVER_REMAPPED:-0}" = "1" ]; then
              echo "==> APP will use Server=127.0.0.1 (hairpin remap); derived MYSQL_* for optional compose mysql: database=$MYSQL_DATABASE user=$MYSQL_APP_USER"
            else
              echo "==> APP uses secret Server as-is; derived MYSQL_* for optional compose mysql: database=$MYSQL_DATABASE user=$MYSQL_APP_USER"
            fi
            echo "==> MYSQL_ROOT_PASSWORD: using stable workflow default (see deploy/GITHUB_SECRETS.md)"

            BRANCH="main"
            # Path setup + git sync as one base64 bash unit.
            # appleboy/drone-ssh injects DRONE_SSH_PREV_COMMAND_EXIT_CODE=... between YAML
            # script lines, which breaks multi-line if/else/clone. Decode+pipe runs atomically.
            echo "==> Running path+git sync (base64 script)"
            echo '' | base64 -d | BRANCH="$BRANCH" REQUESTED_PATH="${{ secrets.PROD_DEPLOY_PATH }}" GITHUB_TOKEN="$GITHUB_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" HOME="$HOME" bash
            DEPLOY_PATH="$(cat /tmp/proaqua_deploy_path)"
            cd "$DEPLOY_PATH"
            echo "==> Deploy path ready: $(pwd) HEAD=$(git rev-parse --short HEAD)"

            # Optional port secrets → sensible defaults (no GitHub secret required)
            FE_PORT='${{ secrets.PROD_FRONTEND_PORT }}'
            if [ -z "$FE_PORT" ]; then FE_PORT=55512; fi
            BE_PORT='${{ secrets.PROD_BACKEND_PORT }}'
            if [ -z "$BE_PORT" ]; then BE_PORT=55511; fi
            MYSQL_PORT=3307
            echo "==> Ports frontend=$FE_PORT backend=$BE_PORT mysql_host=$MYSQL_PORT"

            echo "==> Writing .env.production"
            umask 077
            set +o histexpand 2>/dev/null || set +H 2>/dev/null || true
            # Single-quote secret-bearing values so docker compose --env-file does not
            # strip $VAR inside passwords. Also double $ -> $$ so ${APP_CONNECTION_STRING}
            # YAML interpolation leaves a literal $ in the container (Compose uses $$).
            # Values must not contain single quotes.
            esc_dollar() { printf '%s' "$1" | sed 's/\$/$$/g'; }
            MYSQL_ROOT_PASSWORD_ESC="$(esc_dollar "$MYSQL_ROOT_PASSWORD")"
            MYSQL_APP_PASSWORD_ESC="$(esc_dollar "$MYSQL_APP_PASSWORD")"
            APP_CONNECTION_STRING_ESC="$(esc_dollar "$APP_CONNECTION_STRING")"
            JWT_KEY_ESC="$(esc_dollar "$JWT_KEY_VAL")"
            {
              echo "FRONTEND_PORT=$FE_PORT"
              echo "BACKEND_PORT=$BE_PORT"
              echo "MYSQL_PORT=$MYSQL_PORT"
              echo "MYSQL_ROOT_PASSWORD='$MYSQL_ROOT_PASSWORD_ESC'"
              echo "MYSQL_DATABASE='$MYSQL_DATABASE'"
              echo "MYSQL_APP_USER='$MYSQL_APP_USER'"
              echo "MYSQL_APP_PASSWORD='$MYSQL_APP_PASSWORD_ESC'"
              echo "APP_CONNECTION_STRING='$APP_CONNECTION_STRING_ESC'"
              echo "JWT_KEY='$JWT_KEY_ESC'"
              echo "JWT_ISSUER=ProAquaApi"
              echo "JWT_AUDIENCE=ProAquaClient"
              echo "PUSH_PROVIDER=Dev"
              echo "AMOCRM_ENABLED=false"
              echo "AMOCRM_BASE_URL="
              echo "AMOCRM_ACCESS_TOKEN="
              echo "AMOCRM_PIPELINE_ID="
              echo "AMOCRM_STATUS_ID="
              echo "VITE_API_URL="
              echo "ENABLE_SWAGGER=true"
            } > .env.production

            if [ ! -s .env.production ]; then
              echo "ERROR: .env.production is empty"
              exit 1
            fi
            # Non-secret sanity checks (do not print secret values)
            if ! grep -q '^MYSQL_ROOT_PASSWORD=.\+' .env.production; then
              echo "ERROR: MYSQL_ROOT_PASSWORD is empty"
              exit 1
            fi
            if ! grep -q '^MYSQL_APP_PASSWORD=.\+' .env.production; then
              echo "ERROR: MYSQL_APP_PASSWORD is empty (parse DB_CONNECTION_STRING Password=)"
              exit 1
            fi
            if ! grep -q '^JWT_KEY=.\+' .env.production; then
              echo "ERROR: JWT_KEY secret is empty"
              exit 1
            fi
            if ! grep -q '^APP_CONNECTION_STRING=.\+' .env.production; then
              echo "ERROR: APP_CONNECTION_STRING is empty"
              exit 1
            fi
            if ! grep -qE 'Database=|Initial Catalog=' .env.production; then
              echo "ERROR: APP_CONNECTION_STRING missing Database= (quoting/truncation?)"
              exit 1
            fi
            echo "==> .env.production written ($(wc -l < .env.production) lines; Database= present)"

            echo "==> Preparing uploads directory"
            mkdir -p "$DEPLOY_PATH/data/wwwroot/uploads"
            chmod -R a+rwX "$DEPLOY_PATH/data/wwwroot" 2>/dev/null || true

            echo "==> Checking docker access"
            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: docker not installed for $(whoami)"
              exit 1
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: cannot talk to Docker daemon as $(whoami)"
              echo "HINT: sudo usermod -aG docker $(whoami)  # then re-login / new SSH session"
              exit 1
            fi

            echo "==> docker compose up -d --build"
            if docker compose version >/dev/null 2>&1; then
              docker compose -f docker-compose.production.yml --env-file .env.production up -d --build --remove-orphans
            else
              docker-compose -f docker-compose.production.yml --env-file .env.production up -d --build --remove-orphans
            fi
            docker image prune -f || true
            echo "==> ProAqua deploy done on $TARGET at $(pwd)"
            echo "==> REMINDER: open public ports if clients time out (UFW + cloud SG):"
            echo "    sudo ufw allow ${BE_PORT}/tcp && sudo ufw allow ${FE_PORT}/tcp && sudo ufw reload && sudo ufw status"
            echo "    verify: curl -sS -o /dev/null -w '%{http_code}\\n' http://127.0.0.1:${FE_PORT}/api/health"
            echo "    public: http://$TARGET:${FE_PORT}/swagger/index.html  (mobile BaseUrl uses :${FE_PORT})"
