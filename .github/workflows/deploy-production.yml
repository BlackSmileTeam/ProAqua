name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proaqua-production-deploy
  cancel-in-progress: true

jobs:
  deploy-prod:
    name: Deploy → PROD_HOST
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (PROD)
        id: ssh
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          envs: DB_CONNECTION_STRING,JWT_KEY
          script: |
            set -euo pipefail
            trap 'echo "ERROR: deploy failed at line $LINENO (exit $?)" >&2' ERR

            TARGET="PROD"
            echo "==> Deploy target: $TARGET (${{ secrets.PROD_HOST }})"
            echo "==> whoami=$(whoami) HOME=$HOME pwd=$(pwd)"

            # --- Required secrets via appleboy envs (avoids shell-quoting breakage) ---
            echo "==> Resolving DB connection string secret"
            CONN="${DB_CONNECTION_STRING:-}"
            if [ -z "$CONN" ]; then
              echo "ERROR: set repository secret DB_CONNECTION_STRING (MySQL connection string)"
              exit 1
            fi
            echo "==> Connection string secret present (length=${#CONN})"

            JWT_KEY_VAL="${JWT_KEY:-}"
            if [ -z "$JWT_KEY_VAL" ]; then
              echo "ERROR: set repository secret JWT_KEY"
              exit 1
            fi

            if ! command -v python3 >/dev/null 2>&1; then
              echo "ERROR: python3 is required on the deploy host to parse DB_CONNECTION_STRING"
              exit 1
            fi

            # Robust ADO.NET/.NET MySQL connection-string parser (User/Uid/User ID, Password/Pwd,
            # Database/Initial Catalog). Values may contain shell metacharacters; do not use sed/awk.
            echo "==> Parsing DB_CONNECTION_STRING"
            eval "$(
              CONN="$CONN" python3 - <<'PY'
            import os, shlex, sys

            conn = os.environ.get("CONN", "")
            fields = {}
            for part in conn.split(";"):
                part = part.strip()
                if not part or "=" not in part:
                    continue
                key, _, value = part.partition("=")
                key = "".join(key.lower().split())
                if key and key not in fields:
                    fields[key] = value

            user = fields.get("user") or fields.get("uid") or fields.get("userid")
            password = fields.get("password") or fields.get("pwd")
            database = fields.get("database") or fields.get("initialcatalog")

            missing = []
            if not password:
                missing.append("Password= or Pwd=")
            if missing:
                print(
                    "ERROR: DB_CONNECTION_STRING missing " + ", ".join(missing)
                    + " (cannot derive MYSQL_APP_PASSWORD)",
                    file=sys.stderr,
                )
                sys.exit(1)

            if not user:
                user = "proaqua"
            if not database:
                database = "proaqua"

            app_conn = (
                "Server=mysql;Port=3306;Database=%s;User=%s;Password=%s;"
                "CharSet=utf8mb4;SslMode=None;AllowPublicKeyRetrieval=True"
            ) % (database, user, password)

            found = []
            if any(k in fields for k in ("user", "uid", "userid")):
                found.append("user")
            else:
                found.append("user(default)")
            found.append("password")
            if any(k in fields for k in ("database", "initialcatalog")):
                found.append("database")
            else:
                found.append("database(default)")

            print("echo " + shlex.quote("==> Parsed connection fields: " + ", ".join(found)))
            print("MYSQL_APP_USER=" + shlex.quote(user))
            print("MYSQL_APP_PASSWORD=" + shlex.quote(password))
            print("MYSQL_DATABASE=" + shlex.quote(database))
            print("APP_CONNECTION_STRING=" + shlex.quote(app_conn))
            PY
            )"

            # Root password: stable documented default (not a GitHub secret).
            # First-time MySQL volume init uses this; changing it later does NOT update an existing volume.
            # Default matches .env.production.example — do not randomize on each deploy.
            MYSQL_ROOT_PASSWORD="RootMysql_ChangeMe_2026!"

            echo "==> Derived MySQL: database=$MYSQL_DATABASE user=$MYSQL_APP_USER (password from DB_CONNECTION_STRING)"
            echo "==> MYSQL_ROOT_PASSWORD: using stable workflow default (see deploy/GITHUB_SECRETS.md)"

            REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            BRANCH="main"
            # Default: $HOME/ProAqua (no PROD_DEPLOY_PATH required). Empty secret -> fallback.
            REQUESTED_PATH="${{ secrets.PROD_DEPLOY_PATH }}"
            FALLBACK_PATH="$HOME/ProAqua"
            if [ -z "$REQUESTED_PATH" ]; then
              DEPLOY_PATH="$FALLBACK_PATH"
            else
              DEPLOY_PATH="$REQUESTED_PATH"
            fi
            if [ -z "$REQUESTED_PATH" ]; then
              echo "==> Requested deploy path: <empty -> $FALLBACK_PATH>"
            else
              echo "==> Requested deploy path: $REQUESTED_PATH"
            fi

            echo "==> Ensuring deploy directory exists: $DEPLOY_PATH"
            if ! mkdir -p "$DEPLOY_PATH" 2>/tmp/proaqua_mkdir.err; then
              echo "WARN: cannot create $DEPLOY_PATH: $(cat /tmp/proaqua_mkdir.err)"
              if [ "$DEPLOY_PATH" != "$FALLBACK_PATH" ]; then
                echo "==> Falling back to $FALLBACK_PATH"
                DEPLOY_PATH="$FALLBACK_PATH"
                mkdir -p "$DEPLOY_PATH"
              else
                echo "ERROR: deploy user cannot write $DEPLOY_PATH"
                echo "HINT: leave PROD_DEPLOY_PATH unset (default \$HOME/ProAqua), or set a writable path"
                exit 1
              fi
            fi
            cd "$DEPLOY_PATH"
            echo "==> Using deploy path: $(pwd)"

            echo "==> Syncing git ($BRANCH)"
            if [ ! -d .git ]; then
              git init
              git remote add origin "$REPO_URL"
            else
              git remote set-url origin "$REPO_URL"
            fi

            git fetch --prune origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -f -B "$BRANCH" "origin/$BRANCH"
            echo "==> HEAD=$(git rev-parse --short HEAD)"

            # Optional port secrets → sensible defaults (no GitHub secret required)
            FE_PORT='${{ secrets.PROD_FRONTEND_PORT }}'
            if [ -z "$FE_PORT" ]; then FE_PORT=55512; fi
            BE_PORT='${{ secrets.PROD_BACKEND_PORT }}'
            if [ -z "$BE_PORT" ]; then BE_PORT=55511; fi
            MYSQL_PORT=3307
            echo "==> Ports frontend=$FE_PORT backend=$BE_PORT mysql_host=$MYSQL_PORT"

            echo "==> Writing .env.production"
            umask 077
            {
              echo "FRONTEND_PORT=$FE_PORT"
              echo "BACKEND_PORT=$BE_PORT"
              echo "MYSQL_PORT=$MYSQL_PORT"
              echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD"
              echo "MYSQL_DATABASE=$MYSQL_DATABASE"
              echo "MYSQL_APP_USER=$MYSQL_APP_USER"
              echo "MYSQL_APP_PASSWORD=$MYSQL_APP_PASSWORD"
              echo "APP_CONNECTION_STRING=$APP_CONNECTION_STRING"
              echo "JWT_KEY=$JWT_KEY_VAL"
              echo "JWT_ISSUER=ProAquaApi"
              echo "JWT_AUDIENCE=ProAquaClient"
              echo "PUSH_PROVIDER=Dev"
              echo "AMOCRM_ENABLED=false"
              echo "AMOCRM_BASE_URL="
              echo "AMOCRM_ACCESS_TOKEN="
              echo "AMOCRM_PIPELINE_ID="
              echo "AMOCRM_STATUS_ID="
              echo "VITE_API_URL="
            } > .env.production

            if [ ! -s .env.production ]; then
              echo "ERROR: .env.production is empty"
              exit 1
            fi
            # Non-secret sanity checks (do not print secret values)
            if ! grep -q '^MYSQL_ROOT_PASSWORD=.\+' .env.production; then
              echo "ERROR: MYSQL_ROOT_PASSWORD is empty"
              exit 1
            fi
            if ! grep -q '^MYSQL_APP_PASSWORD=.\+' .env.production; then
              echo "ERROR: MYSQL_APP_PASSWORD is empty (parse DB_CONNECTION_STRING Password=)"
              exit 1
            fi
            if ! grep -q '^JWT_KEY=.\+' .env.production; then
              echo "ERROR: JWT_KEY secret is empty"
              exit 1
            fi
            if ! grep -q '^APP_CONNECTION_STRING=.\+' .env.production; then
              echo "ERROR: APP_CONNECTION_STRING is empty"
              exit 1
            fi
            echo "==> .env.production written ($(wc -l < .env.production) lines)"

            echo "==> Preparing uploads directory"
            mkdir -p "$DEPLOY_PATH/data/wwwroot/uploads"
            chmod -R a+rwX "$DEPLOY_PATH/data/wwwroot" 2>/dev/null || true

            echo "==> Checking docker access"
            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: docker not installed for $(whoami)"
              exit 1
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: cannot talk to Docker daemon as $(whoami)"
              echo "HINT: sudo usermod -aG docker $(whoami)  # then re-login / new SSH session"
              exit 1
            fi

            echo "==> docker compose up -d --build"
            if docker compose version >/dev/null 2>&1; then
              docker compose -f docker-compose.production.yml --env-file .env.production up -d --build --remove-orphans
            else
              docker-compose -f docker-compose.production.yml --env-file .env.production up -d --build --remove-orphans
            fi
            docker image prune -f || true
            echo "==> ProAqua deploy done on $TARGET at $(pwd)"
